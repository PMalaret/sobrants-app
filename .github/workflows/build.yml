name: Compilar ejecutables

# Genera el .exe de Windows, el binario de macOS y el de Linux en cada
# push/PR, y los deja descargables como "artifacts" del workflow run.
# Para publicarlos como Release adjunta al repo, crea un tag "v*.*.*".

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Sobrants.exe
            asset_name: Sobrants-Windows.exe
          - os: macos-latest
            artifact_name: Sobrants
            asset_name: Sobrants-macOS
          - os: ubuntu-latest
            artifact_name: Sobrants
            asset_name: Sobrants-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller sobrants.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    # Sólo al empujar un tag "vX.Y.Z": publica los tres binarios como
    # assets fijos de una GitHub Release (no caducan, a diferencia de
    # los artifacts de Actions, que se borran a los 90 días).
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Preparar assets
        run: |
          mkdir -p release
          cp artifacts/Sobrants-Windows.exe/Sobrants.exe release/Sobrants-Windows.exe
          cp artifacts/Sobrants-macOS/Sobrants release/Sobrants-macOS
          cp artifacts/Sobrants-Linux/Sobrants release/Sobrants-Linux
          chmod +x release/Sobrants-macOS release/Sobrants-Linux
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --title "Sobrants ${{ github.ref_name }}" \
            --generate-notes
