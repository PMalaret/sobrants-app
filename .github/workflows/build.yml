name: Compilar ejecutables

# Genera el .exe de Windows en cada push/PR y lo deja descargable como
# "artifact" del workflow run. Para publicarlo como Release adjunta al
# repo, crea un tag "v*.*.*".
#
# Sólo Windows: es el sistema donde se usa la aplicación. El código no
# tiene nada específico de ningún sistema y sigue arrancando en macOS y
# Linux con `python run_app.py`; quien necesite un binario para uno de
# esos dos lo compila allí mismo con PyInstaller (README, "Opción B"),
# porque PyInstaller no compila de forma cruzada. Para volver a generarlos
# aquí, basta con devolver la matriz de sistemas al job `build` y sus
# líneas al paso "Preparar assets".

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Los tests corren en Windows, el mismo sistema donde se ejecuta la
    # aplicación: así cualquier problema propio de Windows (rutas, fines
    # de línea) sale aquí y no en la máquina del usuario.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller sobrants.spec --noconfirm
      # En Windows dist/Sobrants es una carpeta (modo onedir): dentro van
      # Sobrants.exe y _internal/.
      - uses: actions/upload-artifact@v7
        with:
          name: Sobrants-Windows
          path: dist/Sobrants

  release:
    # Sólo al empujar un tag "vX.Y.Z": publica el ejecutable como asset
    # fijo de una GitHub Release (no caduca, a diferencia de los
    # artifacts de Actions, que se borran a los 90 días).
    #
    # Este job no compila nada (sólo comprime y publica), así que se queda
    # en Linux, que es el runner más barato y el que trae `zip` y `gh`.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Con `name` fijo, el contenido se extrae directo en `path` (sin
          # subcarpeta "Sobrants-Windows/" de por medio). Sin `name`, v8 sólo
          # crea esa subcarpeta cuando hay más de un artifact en el run; con
          # uno solo —nuestro caso desde que el job `build` dejó de tener
          # matriz— lo deja igual de plano, y el `cd` de abajo fallaba
          # (v1.35.0 se quedó sin publicar por esto). Fijar `name` hace que
          # el resultado no dependa de cuántos artifacts haya.
          name: Sobrants-Windows
          path: artifacts
      - name: Preparar assets
        run: |
          mkdir -p release
          # Windows: carpeta onedir (Sobrants.exe + _internal/). Una
          # Release sólo admite ficheros sueltos, así que se comprime;
          # el .exe de dentro sigue sin autoextraerse a %TEMP%.
          (cd artifacts && zip -rq ../release/Sobrants-Windows.zip .)
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Sobrants ${{ github.ref_name }}" \
            --generate-notes
      - name: Recordatorio de envío a Microsoft si Defender sigue avisando
        # No hay API pública para automatizar el envío a Microsoft (el
        # formulario web pide login/captcha). Si tras pasar a onedir
        # Defender sigue marcando el .exe, este issue deja los pasos
        # manuales a mano en vez de tener que recordarlos.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Si Defender avisa en ${{ github.ref_name }}: enviar Sobrants.exe como falso positivo" \
            --body "No hay API pública para automatizar esto, hay que hacerlo a mano solo si hace falta:

          1. Baja \`Sobrants-Windows.zip\` de https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }} y extrae \`Sobrants.exe\`.
          2. Ve a https://www.microsoft.com/en-us/wdsi/filesubmission, súbelo y marca \"I believe this file is incorrectly detected as malware\" (falso positivo).
          3. Suele resolverse en 24-72h. Cierra este issue cuando se confirme.

          Si nadie ha reportado el aviso de Defender, cierra este issue sin más."
